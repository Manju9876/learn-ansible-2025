- name: vault retrive
  hosts: localhost
  connection: local
  tasks:
    - name: print the secret
      set_fact:
        msg: "{{ lookup('community.hashi_vault.hashi_vault', 'secret=github-runner/data/path:token token=' ~ vault_token ~ ' url=http://vault.devopsmanju.shop:8200') }}"

    - name: print command
      ansible.builtin.debug:
        command: ./config.sh --url https://github.com/manjudevopszone --token {{ msg }}
